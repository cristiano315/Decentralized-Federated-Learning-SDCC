syntax = "proto3";  

package federated;

// Generate GO code
option go_package = "./federated";

// ===============================================================
// SERVICE REGISTRY
// ===============================================================

service RegistryService {
    // Register to the service registry
    rpc RegisterNode (NodeInfo) returns (RegisterResponse);
    // Register when respawned after a crash
    rpc RegisterRespawnedNode (NodeInfo) returns (RegisterResponse);
    // Discover other nodes in the network
    rpc DiscoverNodes (DiscoverRequest) returns (DiscoverResponse);
    // Unregister from the service registry
    rpc UnregisterNode (NodeInfo) returns (Ack);
    // Signal to the registry that a node is unresponsive
    rpc SignalUnresponsiveNode (FullNodeInfo) returns (Ack);
    // Request to change node status
    rpc ChangeNodeStatus (ChangeStatusRequest) returns (Ack);
}

// ===============================================================
// CLIENTS COMMUNICATION
// ===============================================================

service FederatedNode {
    // A client sends local weights to other clients (Gossip/P2P)
    rpc SendWeights (WeightPayload) returns (Ack);
    // A client requests weights from other clients (Gossip/P2P)
    rpc RequestWeights (WeightRequest) returns (WeightPayload);
    // A registry node can ping other nodes to check if they are alive
    rpc Ping (NodeInfo) returns (Ack);
    // A registry node can notify other nodes that a node is unresponsive
    rpc NotifyUnresponsiveNode (NodeInfo) returns (Ack);
    // A client requests to start a training sending data to other clients
    rpc StartTraining (StartTrainingRequest) returns (Ack);
}

// ===============================================================
// CENTRAL SERVER
// ===============================================================

service FederatedServer {
    // A client sends local weights to the central server for aggregation
    rpc SendLocalModel (WeightPayload) returns (Ack);
    
    // A client requests the updated global model from the server
    rpc GetGlobalModel (GlobalModelRequest) returns (WeightPayload);
}

// ===============================================================
// MESSAGES
// ===============================================================

// Node information for registration and discovery
message NodeInfo {
    string node_id = 1; // Unique identifier for the node
    string ip_address = 2; // IP address of the node
    int32 port = 3; // Port number for communication
    string status = 4; // Status of the node (e.g., "idle", "working")
}

// Full node info for fault recovery
message FullNodeInfo {
    string node_id = 1; // Unique identifier for the node
    string ip_address = 2; // IP address of the node
    int32 port = 3; // Port number for communication
    int32 current_round = 4; // Last training round completed by the node
    int32 required_nodes = 5; // Number of nodes required for the training
    int32 total_rounds = 6; // Total number of training rounds
    int32 max_discovery_retries = 7; // Maximum number of retries for node discovery
    int32 weight_wait_timeout_seconds = 8; // Timeout in seconds for waiting for weights from peers
}

// Response for registration
message RegisterResponse {
    bool success = 1; // Indicates if registration was successful
    string message = 2; // Additional information about the registration
}

// Request for discovering nodes
message DiscoverRequest {
    string node_id = 1; // Unique identifier for the requesting node
    int32 request_count = 2; // Number of nodes required
}

// Response for discovering nodes
message DiscoverResponse {
    repeated NodeInfo nodes = 1; // List of discovered nodes
}

// PyTorch weights payload for sending model updates
message WeightPayload {
    string sender_id = 1;
    int32 round_number = 2; // Current training round, to be used in case one is behind
    
    // Serialize state_dict() as a byte flow
    bytes model_weights = 3; 
    
    // To be used for fed avg, to know how many samples were used to compute the weights
    int32 num_samples = 4; 
}

// Simple acknowledgment message for communication
message Ack {
    bool success = 1;
    string message = 2;
}

// Request for the global model from the central server
message GlobalModelRequest {
    string requester_id = 1;
}

// Request for local weights from other clients (Gossip/P2P)
message WeightRequest {
    string requester_id = 1;
    int32 round_number = 2; // Current training round, to be used in case one is behind
}

// Request for starting a training session
message StartTrainingRequest {
    string starter_id = 1;
    int32 training_nodes = 2;
    int32 total_rounds = 3;
    int32 start_round = 4;
    int32 num_peers_required = 5;
    int32 max_discovery_retries = 6;
    int32 weight_wait_timeout_seconds = 7;
    repeated NodeInfo peers = 8;
}

// Message for changing node status
message ChangeStatusRequest {
    string node_id = 1;
    string new_status = 2; // New status for the node ("idle" or "working")
}   